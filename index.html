<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="قائمة طعام مطاعم الشيباني ماستر — التربة، تعز — والطلب المباشر عبر واتساب">
  <meta name="theme-color" content="#b91c1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="الشيباني ماستر">
  <title>مطاعم الشيباني ماستر | المنيو والطلب عبر واتساب</title>
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- ============================================================
       ملاحظة: البيانات والأسعار والألوان كلها قابلة للتعديل
       الألوان: غيّرها في متغيرات CSS داخل وسم <style> (ابحث عن :root)
       الأصناف والرقم: غيّرها في قسم "الإعدادات" داخل وسم <script> بالأسفل
       ============================================================ -->
  <style>
    :root{
      /* ===== الألوان (غيّر هنا لتغيير شكل التطبيق كله) ===== */
      --primary:      #b91c1c;   /* اللون الأساسي (أحمر) */
      --primary-dark: #991b1b;   /* أحمر أغمق للظلال */
      --accent:       #f59e0b;   /* اللون المميز (ذهبي) */
      --bg:           #fdf6ec;   /* لون خلفية الصفحة */
      --card:         #ffffff;   /* لون البطاقات */
      --text:         #292524;   /* لون النص */
      --muted:        #78716c;   /* نص ثانوي رمادي */
      --green:        #16a34a;   /* لون زر واتساب */
      --green-dark:   #15803d;
      --radius:       16px;
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      font-family:'Segoe UI', Tahoma, 'Noto Kufi Arabic', sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      padding-bottom:110px; /* مساحة لزر السلة العائم */
    }

    /* ---------- الترويسة ---------- */
    header{
      background:linear-gradient(160deg, var(--primary) 0%, var(--primary-dark) 100%);
      color:#fff;
      text-align:center;
      padding:22px 16px 18px;
      border-bottom:4px solid var(--accent);
    }
    header .logo{font-size:44px;line-height:1}
    header h1{font-size:1.6rem;margin-top:6px;letter-spacing:.5px}
    header p{font-size:.85rem;opacity:.9;margin-top:4px}

    /* ---------- شريط الأقسام ---------- */
    nav{
      position:sticky;top:0;z-index:20;
      background:var(--bg);
      display:flex;gap:8px;justify-content:center;
      padding:10px 12px;border-bottom:1px solid #e7e0d4;
      overflow-x:auto;
    }
    nav a{
      flex:0 0 auto;text-decoration:none;color:var(--primary);
      background:#fff;border:1.5px solid var(--primary);
      padding:6px 16px;border-radius:999px;font-size:.85rem;font-weight:700;
    }
    nav a:active{background:var(--primary);color:#fff}

    /* ---------- الأقسام والأصناف ---------- */
    main{max-width:640px;margin:0 auto;padding:8px 12px}
    section h2{
      font-size:1.15rem;color:var(--primary-dark);
      margin:18px 4px 10px;display:flex;align-items:center;gap:8px;
      border-right:5px solid var(--accent);padding-right:10px;
    }
    .items{display:grid;grid-template-columns:1fr;gap:10px}
    @media (min-width:480px){.items{grid-template-columns:1fr 1fr}}

    .card{
      background:var(--card);border-radius:var(--radius);
      box-shadow:0 2px 8px rgba(0,0,0,.06);
      padding:12px;display:flex;gap:10px;align-items:center;
    }
    .card .emoji{
      font-size:44px;flex:0 0 64px;height:64px;
      display:flex;align-items:center;justify-content:center;
      background:var(--bg);border-radius:12px;
    }
    .card .info{flex:1;min-width:0}
    .card .name{font-weight:700;font-size:.95rem}
    .card .desc{font-size:.75rem;color:var(--muted);margin-top:2px}
    .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
    .price{font-weight:800;color:var(--primary-dark);font-size:.9rem;white-space:nowrap}
    .add-btn{
      border:none;cursor:pointer;background:var(--primary);color:#fff;
      font-family:inherit;font-size:.8rem;font-weight:700;
      padding:7px 12px;border-radius:999px;white-space:nowrap;
    }
    .add-btn:active{transform:scale(.95);background:var(--primary-dark)}

    footer{text-align:center;font-size:.75rem;color:var(--muted);padding:24px 16px 8px}

    /* ---------- زر السلة العائم ---------- */
    #cartFab{
      position:fixed;bottom:16px;left:16px;right:16px;z-index:30;
      max-width:640px;margin:0 auto;
      border:none;cursor:pointer;font-family:inherit;
      background:var(--primary);color:#fff;
      border-radius:999px;padding:14px 20px;
      display:flex;align-items:center;justify-content:space-between;
      font-size:1rem;font-weight:800;
      box-shadow:0 6px 20px rgba(185,28,28,.4);
    }
    #cartFab .badge{
      background:var(--accent);color:#3f2d04;border-radius:999px;
      min-width:28px;height:28px;padding:0 8px;
      display:inline-flex;align-items:center;justify-content:center;
      font-size:.85rem;margin-inline-start:8px;
    }

    /* ---------- نافذة السلة ---------- */
    #overlay{
      position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;
      opacity:0;pointer-events:none;transition:opacity .25s;
    }
    #overlay.show{opacity:1;pointer-events:auto}
    #cartSheet{
      position:fixed;bottom:0;left:0;right:0;z-index:50;
      max-width:640px;margin:0 auto;
      background:#fff;border-radius:20px 20px 0 0;
      max-height:80vh;display:flex;flex-direction:column;
      transform:translateY(105%);transition:transform .3s;
      box-shadow:0 -6px 24px rgba(0,0,0,.2);
    }
    #cartSheet.show{transform:translateY(0)}
    .sheet-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 16px;border-bottom:1px solid #eee;
    }
    .sheet-head h3{font-size:1.05rem}
    .close-btn{border:none;background:#f3f0ea;border-radius:50%;width:34px;height:34px;font-size:1.1rem;cursor:pointer}
    .cart-items{overflow-y:auto;padding:10px 16px;flex:1}
    .cart-line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e7e0d4}
    .cart-line:last-child{border-bottom:none}
    .cart-line .ci-emoji{font-size:30px}
    .cart-line .ci-info{flex:1;min-width:0}
    .cart-line .ci-name{font-size:.9rem;font-weight:700}
    .cart-line .ci-price{font-size:.8rem;color:var(--muted)}
    .qty{display:flex;align-items:center;gap:8px}
    .qty button{
      width:30px;height:30px;border:none;border-radius:8px;cursor:pointer;
      background:var(--bg);font-size:1.1rem;font-weight:800;color:var(--primary-dark);
    }
    .qty span{min-width:22px;text-align:center;font-weight:800}
    .sheet-foot{padding:12px 16px 18px;border-top:1px solid #eee}
    .total-row{display:flex;justify-content:space-between;font-size:1.1rem;font-weight:800;margin-bottom:10px}
    .wa-btn{
      width:100%;border:none;cursor:pointer;font-family:inherit;
      background:var(--green);color:#fff;border-radius:12px;
      padding:14px;font-size:1rem;font-weight:800;
      display:flex;align-items:center;justify-content:center;gap:10px;
    }
    .wa-btn:active{background:var(--green-dark)}
    .clear-btn{width:100%;border:none;background:none;color:var(--muted);font-family:inherit;font-size:.8rem;margin-top:8px;cursor:pointer;padding:6px}
    .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:.9rem}

    /* ---------- تنبيه صغير ---------- */
    #toast{
      position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);
      background:#292524;color:#fff;font-size:.85rem;
      padding:8px 18px;border-radius:999px;opacity:0;z-index:60;
      transition:all .25s;pointer-events:none;white-space:nowrap;
    }
    #toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>

<header>
  <div class="logo">🍽️</div>
  <h1 id="restName">مطاعم الشيباني ماستر</h1>
  <p>📍 التربة — الطريق الدائري · <a href="https://maps.app.goo.gl/sVjpsbmtyN8QHqAA7" style="color:#fde68a">الخرائط</a> · مفتوح ٢٤ ساعة</p>
</header>

<nav id="catNav"></nav>

<main id="menuRoot"></main>

<footer id="footText">مطاعم الشيباني ماستر — التربة، الطريق الدائري، خط 24</footer>

<button id="cartFab" onclick="openCart()">
  <span>🛒 السلة<span class="badge" id="cartCount">0</span></span>
  <span id="cartTotalFab">0 ر.ي</span>
</button>

<div id="overlay" onclick="closeCart()"></div>

<div id="cartSheet" role="dialog" aria-label="سلة الطلب">
  <div class="sheet-head">
    <h3>🛒 سلة الطلب</h3>
    <button class="close-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="sheet-foot">
    <div class="total-row"><span>المجموع</span><span id="cartTotal">0 ر.ي</span></div>
    <button class="wa-btn" onclick="orderWhatsApp()">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 2.1.55 4.14 1.6 5.95L2.05 22l4.33-1.13a9.87 9.87 0 0 0 5.66 1.8h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.13h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-2.5.66.67-2.44-.2-.32a8.17 8.17 0 0 1-1.26-4.39c0-4.54 3.7-8.23 8.24-8.23a8.2 8.2 0 0 1 5.82 2.41 8.18 8.18 0 0 1 2.4 5.83c0 4.54-3.7 8.24-8.23 8.24zm4.52-6.16c-.25-.12-1.47-.72-1.69-.8-.23-.09-.4-.13-.57.12-.17.25-.65.8-.8.97-.15.17-.3.18-.55.06-.25-.12-1.05-.38-2-1.22-.74-.66-1.24-1.47-1.38-1.72-.15-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.12-.15.17-.25.25-.42.09-.17.04-.32-.02-.44-.06-.12-.57-1.36-.78-1.86-.2-.49-.41-.42-.57-.43h-.49c-.17 0-.44.06-.67.32-.23.25-.88.86-.88 2.09 0 1.24.9 2.44 1.02 2.6.12.17 1.77 2.7 4.28 3.79.6.26 1.06.41 1.43.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.16-.48-.28z"/></svg>
      اطلب عبر واتساب
    </button>
    <button class="clear-btn" onclick="clearCart()">إفراغ السلة</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   ⚙️ الإعدادات — عدّل هنا فقط:
   1) رقم واتساب بدون + وبدون مسافات (مثال: 967771234567)
   2) اسم المطعم والوصف والعملة
   3) الأصناف والأسعار (السعر بالريال اليمني)
   ============================================================ */
const CONFIG = {
  restaurant:  'مطاعم الشيباني ماستر',   // الاسم الرسمي من الموقع
  tagline:     'أشهى المشاوي والمأكولات اليمنية الأصيلة — مفتوح ٢٤ ساعة',
  whatsapp:    '967779703535',           // واتساب المطعم من الموقع (779 70 35 35)
  currency:    'ر.ي',                    // العملة بعد السعر
  categories: [
    {
      name: 'المشاوي', emoji: '🔥', id: 'grills',
      items: [
        { name: 'دجاج مشوي على الفحم',   desc: 'نصف دجاجة مع صلصة الطحينة',    price: 2500, emoji: '🍗' },
        { name: 'لحم مشوي على الفحم',    desc: 'نصف كيلو لحم طازج',            price: 4000, emoji: '🥩' },
        { name: 'ريش لحم',               desc: 'ريش لحم مشوية بالتتبيلة',      price: 3500, emoji: '🍖' },
        { name: 'شيش طاووق',             desc: 'أسياخ دجاج متبل على الفحم',    price: 2800, emoji: '🍢' }
      ]
    },
    {
      name: 'حنيد ومندي', emoji: '🍚', id: 'mandi',
      items: [
        { name: 'مندي دجاج',             desc: 'أرز بسمتي بالزعفران + دجاج',   price: 2500, emoji: '🍗' },
        { name: 'مندي لحم',              desc: 'لحم بلدي على الأرز',           price: 4500, emoji: '🍖' },
        { name: 'حنيد لحم',              desc: 'حنيد على الطريقة الحضرمية',    price: 4000, emoji: '🐑' },
        { name: 'مظبي دجاج',             desc: 'دجاج على المنقل مع الأرز',     price: 2500, emoji: '🔥' },
        { name: 'برياني لحم',            desc: 'أرز برياني بالبهارات',         price: 3000, emoji: '🍛' }
      ]
    },
    {
      name: 'وجبات عائلية', emoji: '🥘', id: 'family',
      items: [
        { name: 'مندي عائلي (٤ أشخاص)',  desc: 'دجاجتان + طبق أرز كبير',       price: 9000, emoji: '🍗' },
        { name: 'مشويات عائلية',         desc: 'تشكيلة لحوم ودجاج للعائلة',    price: 12000, emoji: '🥩' },
        { name: 'برياني عائلي',          desc: 'قدر برياني كبير مع سلطة',      price: 8000, emoji: '🍛' }
      ]
    },
    {
      name: 'مقبلات وسلطات', emoji: '🥗', id: 'salads',
      items: [
        { name: 'طحينة',                 desc: 'طحينة طازجة',                  price: 400,  emoji: '🥣' },
        { name: 'سلطة خضراء',            desc: 'طماطم وخيار وبصل بالليمون',    price: 400,  emoji: '🥗' },
        { name: 'حمص بالطحينة',          desc: 'حمص مطحون مع زيت زيتون',       price: 600,  emoji: '🫘' },
        { name: 'بابا غنوج',             desc: 'باذنجان مشوي بالطحينة',        price: 700,  emoji: '🍆' },
        { name: 'خبز طازج',              desc: 'من الفرن مباشرة',              price: 100,  emoji: '🫓' }
      ]
    },
    {
      name: 'المشروبات', emoji: '🥤', id: 'drinks',
      items: [
        { name: 'شاي كرك',               desc: 'شاي بحليب على الطريقة الخليجية', price: 300, emoji: '🫖' },
        { name: 'قهوة عربية',            desc: 'دلة قهوة سادة مع هيل',          price: 500, emoji: '☕' },
        { name: 'عصير مانجو طازج',       desc: 'كوب كبير',                      price: 700, emoji: '🥭' },
        { name: 'لبن طازج',              desc: 'كوب بارد',                      price: 400, emoji: '🥛' },
        { name: 'بيبسي',                 desc: 'علبة 330 مل',                   price: 300, emoji: '🥤' },
        { name: 'شاهي عدني',             desc: 'شاي عدني بالهيل والزعفران',     price: 400, emoji: '🍵' }
      ]
    }
  ]
};

/* ============================================================
   لا تعدّل ما تحت هذا السطر إلا إذا كنت تعرف ماذا تفعل 🙂
   ============================================================ */

const fmt = n => n.toLocaleString('en-US') + ' ' + CONFIG.currency;

// خريطة الأصناف: المفتاح = اسم الصنف (حتى تبقى سلتك محفوظة بعد التحديث)
const ITEM_MAP = {};
CONFIG.categories.forEach(cat => cat.items.forEach(it => { ITEM_MAP[it.name] = { ...it, cat: cat.name }; }));

// السلة محفوظة في الجهاز (تبقى حتى بعد إغلاق التطبيق)
let cart = {};
try { cart = JSON.parse(localStorage.getItem('shibani-cart') || '{}'); } catch (e) { cart = {}; }
const saveCart = () => localStorage.setItem('shibani-cart', JSON.stringify(cart));

// ---------- بناء المنيو من CONFIG ----------
function renderMenu() {
  document.getElementById('restName').textContent = CONFIG.restaurant;
  document.getElementById('footText').textContent = CONFIG.restaurant + ' — ' + CONFIG.tagline;

  const nav = document.getElementById('catNav');
  nav.innerHTML = CONFIG.categories.map(c =>
    `<a href="#${c.id}">${c.emoji} ${c.name}</a>`
  ).join('');

  const root = document.getElementById('menuRoot');
  root.innerHTML = CONFIG.categories.map(cat => `
    <section id="${cat.id}">
      <h2>${cat.emoji} ${cat.name}</h2>
      <div class="items">
        ${cat.items.map(it => `
          <div class="card">
            <div class="emoji">${it.emoji}</div>
            <div class="info">
              <div class="name">${it.name}</div>
              <div class="desc">${it.desc || ''}</div>
              <div class="row">
                <span class="price">${fmt(it.price)}</span>
                <button class="add-btn" data-name="${it.name}">أضف للسلة +</button>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </section>`).join('');

  // أزرار الإضافة (event delegation حتى تعمل بدون إعادة ربط)
  root.addEventListener('click', e => {
    const btn = e.target.closest('.add-btn');
    if (!btn) return;
    addToCart(btn.dataset.name);
  });
}

// ---------- منطق السلة ----------
function cartCount() { return Object.values(cart).reduce((s, q) => s + q, 0); }
function cartTotal() { return Object.entries(cart).reduce((s, [name, q]) => s + (ITEM_MAP[name] ? ITEM_MAP[name].price * q : 0), 0); }

function addToCart(name) {
  cart[name] = (cart[name] || 0) + 1;
  saveCart(); refreshCartUI();
  showToast('أُضيفت «' + name + '» للسلة ✔');
}
function changeQty(name, delta) {
  cart[name] = (cart[name] || 0) + delta;
  if (cart[name] <= 0) delete cart[name];
  saveCart(); refreshCartUI();
}
function clearCart() { cart = {}; saveCart(); refreshCartUI(); }

function refreshCartUI() {
  document.getElementById('cartCount').textContent = cartCount();
  document.getElementById('cartTotalFab').textContent = fmt(cartTotal());
  document.getElementById('cartTotal').textContent = fmt(cartTotal());

  const box = document.getElementById('cartItems');
  const entries = Object.entries(cart);
  if (entries.length === 0) {
    box.innerHTML = '<div class="empty">السلة فارغة 🛒<br>أضف أصنافاً من المنيو</div>';
    return;
  }
  box.innerHTML = entries.map(([name, qty]) => {
    const it = ITEM_MAP[name];
    if (!it) return '';
    return `
      <div class="cart-line">
        <div class="ci-emoji">${it.emoji}</div>
        <div class="ci-info">
          <div class="ci-name">${name}</div>
          <div class="ci-price">${fmt(it.price)} × ${qty} = ${fmt(it.price * qty)}</div>
        </div>
        <div class="qty">
          <button onclick="changeQty('${name}', -1)">−</button>
          <span>${qty}</span>
          <button onclick="changeQty('${name}', 1)">+</button>
        </div>
      </div>`;
  }).join('');
}

function openCart()  { document.getElementById('cartSheet').classList.add('show'); document.getElementById('overlay').classList.add('show'); }
function closeCart() { document.getElementById('cartSheet').classList.remove('show'); document.getElementById('overlay').classList.remove('show'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- الطلب عبر واتساب ----------
function orderWhatsApp() {
  if (cartCount() === 0) { showToast('سلتك فارغة — أضف أصنافاً أولاً'); return; }
  let msg = '🍽️ طلب جديد من ' + CONFIG.restaurant + '\n\n';
  Object.entries(cart).forEach(([name, qty]) => {
    const it = ITEM_MAP[name];
    msg += '• ' + name + ' × ' + qty + ' = ' + fmt(it.price * qty) + '\n';
  });
  msg += '\nالمجموع: ' + fmt(cartTotal());
  msg += '\n\nالرجاء تأكيد الطلب والتوصيل 🙏';
  window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg), '_blank');
}

// ---------- تسجيل عامل الخدمة (للعمل بدون إنترنت وتحويل APK) ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => { /* غير حرج */ });
}

renderMenu();
refreshCartUI();
</script>
</body>
</html>
